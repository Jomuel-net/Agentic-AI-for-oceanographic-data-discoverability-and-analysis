[project]
name = "local_checking_crewai"
version = "0.1.0"
description = "Local_checking_crewai using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.2"
]

[project.scripts]
local_checking_crewai = "local_checking_crewai.main:run"
run_crew = "local_checking_crewai.main:run"
train = "local_checking_crewai.main:train"
replay = "local_checking_crewai.main:replay"
test = "local_checking_crewai.main:test"
run_with_trigger = "local_checking_crewai.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
